name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: デプロイ一式 zip を生成
        run: bash scripts/build_release.sh

      - name: GitHub Release を作成・アセットを添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/parking-ticket-app-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(bash scripts/release_notes.sh)"
